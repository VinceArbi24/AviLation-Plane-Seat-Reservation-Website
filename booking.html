<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AviLiation — Book Flight</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="login.html" class="brand">
      <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28" aria-hidden="true">
        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
      </svg>
      <span>AviLiation</span>
    </a>
    <nav class="main-nav" aria-label="Primary">
      <a href="login.html">Log In</a>
      <a href="signup.html">Sign Up</a>
      <a href="booking.html" class="active">Book Flight</a>
      <a href="seats.html">Seat Reservation</a>
    </nav>
    <div class="user-chip" id="userChip">Guest</div>
  </div>
</header>
<main>
  <div class="steps" aria-label="Progress">
    <div class="step done"><span class="num">1</span><div>Account</div></div>
    <div class="step active"><span class="num">2</span><div>Booking</div></div>
    <div class="step"><span class="num">3</span><div>Seat Reservation</div></div>
  </div>
  <div class="card wide">
    <h2>Book Your Flight</h2>
    <p class="sub">Fill in your trip details, then choose your seat.</p>
    <form id="bookingForm" novalidate>
      
<div class="form-row">

    <!-- DEPARTURE LOCATION -->
    <div class="form-group">
        <label for="from">From</label>

        <input type="text"
               id="from"
               name="from"
               list="departureLocations"
               placeholder="Enter departure location"
               autocomplete="off"
               required />

        <datalist id="departureLocations">
            <option value="Manila, Philippines (MNL)">
            <option value="Mactan, Cebu, Philippines (CEB)">
            <option value="Malaysia (KUL)">
            <option value="Maldives (MLE)">
            <option value="Mexico (MEX)">
            <option value="Madrid, Spain (MAD)">
            <option value="Mumbai, India (BOM)">
            <option value="Melbourne, Australia (MEL)">
            <option value="Macau (MFM)">
            <option value="Muscat, Oman (MCT)">
            <option value="Tokyo, Japan (NRT)">
            <option value="Singapore (SIN)">
            <option value="Seoul, South Korea (ICN)">
            <option value="Bangkok, Thailand (BKK)">
            <option value="Dubai, UAE (DXB)">
        </datalist>
    </div>


    <!-- DESTINATION LOCATION -->
    <div class="form-group">
        <label for="to">To</label>

        <input type="text"
               id="to"
               name="to"
               list="destinationLocations"
               placeholder="Where do you want to go?"
               autocomplete="off"
               required />

        <datalist id="destinationLocations">
            <option value="Manila, Philippines (MNL)">
            <option value="Mactan, Cebu, Philippines (CEB)">
            <option value="Malaysia (KUL)">
            <option value="Maldives (MLE)">
            <option value="Mexico (MEX)">
            <option value="Madrid, Spain (MAD)">
            <option value="Mumbai, India (BOM)">
            <option value="Melbourne, Australia (MEL)">
            <option value="Macau (MFM)">
            <option value="Muscat, Oman (MCT)">
            <option value="Tokyo, Japan (NRT)">
            <option value="Singapore (SIN)">
            <option value="Seoul, South Korea (ICN)">
            <option value="Bangkok, Thailand (BKK)">
            <option value="Dubai, UAE (DXB)">
            <option value="London, United Kingdom (LHR)">
            <option value="Paris, France (CDG)">
            <option value="New York, USA (JFK)">
            <option value="Sydney, Australia (SYD)">
            <option value="Hong Kong (HKG)">
        </datalist>
    </div>

</div>

      <div class="form-row">
        <div class="form-group">
          <label for="departDate">Departure Date</label>
          <input type="date" id="departDate" required />
        </div>
        <div class="form-group">
          <label for="passengers">Passengers</label>
          <input type="number" id="passengers" min="1" max="9" value="1" required />
        </div>
        <div class="form-group">
          <label for="cabin">Cabin Class</label>
          <select id="cabin">
            <option>Economy</option>
            <option>Premium Economy</option>
            <option>Business</option>
            <option>First</option>
          </select>
        </div>
      </div>
      <button type="submit" class="btn">Continue to Seat Selection</button>
      <div id="bookingMsg" class="msg" role="alert"></div>
    </form>
  </div>
</main>
<footer>AviLiation &middot; Demo application &mdash; no real flight bookings are made.</footer>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/common.js"></script>
<script src="js/booking.js"></script>
</body>
</html>
