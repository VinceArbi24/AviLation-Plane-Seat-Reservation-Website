<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AviLiation — Seat Reservation</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header class="site-header">
  <div class="header-inner">
    <a href="login.html" class="brand">
      <svg viewBox="0 0 24 24" fill="currentColor" width="28" height="28" aria-hidden="true">
        <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
      </svg>
      <span>AviLiation</span>
    </a>
    <nav class="main-nav" aria-label="Primary">
      <a href="login.html">Log In</a>
      <a href="signup.html">Sign Up</a>
      <a href="booking.html">Book Flight</a>
      <a href="seats.html" class="active">Seat Reservation</a>
    </nav>
    <div class="user-chip" id="userChip">Guest</div>
  </div>
</header>
<main>
  <div class="steps" aria-label="Progress">
    <div class="step done"><span class="num">1</span><div>Account</div></div>
    <div class="step done"><span class="num">2</span><div>Booking</div></div>
    <div class="step active"><span class="num">3</span><div>Seat Reservation</div></div>
  </div>
  <div class="card wide">
    <h2>Select Your Seat</h2>
    <p class="sub">Click an available seat, then confirm your reservation.</p>
    <div class="flight-summary" id="flightSummary"></div>
    <div class="plane">
      <div class="cockpit">COCKPIT</div>
      <div id="planeBody"><!-- seats generated by js/seats.js --></div>
    </div>
    <div class="legend">
      <div class="legend-item"><span class="box available"></span> Available</div>
      <div class="legend-item"><span class="box taken"></span> Taken</div>
      <div class="legend-item"><span class="box selected"></span> Your choice</div>
    </div>
    <form id="reserveForm" novalidate>
      <div class="form-row">
        <div class="form-group">
          <label for="fullname">Passenger Name</label>
          <input type="text" id="fullname" readonly />
        </div>
        <div class="form-group">
          <label for="chosenSeat">Selected Seat</label>
          <input type="text" id="chosenSeat" readonly placeholder="Click a seat above" />
        </div>
      </div>
      <button type="submit" class="btn" id="submitBtn" disabled>Reserve Seat</button>
      <div id="seatsMsg" class="msg" role="alert"></div>
    </form>
  </div>
</main>
<footer>AviLiation &middot; Demo application &mdash; no real flight bookings are made.</footer>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="js/common.js"></script>
<script src="js/seats.js"></script>
</body>
</html>
